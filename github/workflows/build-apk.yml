name: Build HANIMEX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_ZIP: HANIMEX-android-project-1.zip
      PROJECT_DIR: project

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate project archive
        shell: bash
        run: |
          ls -l
          test -f "$PROJECT_ZIP" || {
            echo "Missing project archive: $PROJECT_ZIP"
            exit 1
          }

      - name: Extract project
        shell: bash
        run: |
          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$PROJECT_ZIP" -d "$PROJECT_DIR"

          echo "Extracted project structure:"
          find "$PROJECT_DIR" -maxdepth 2 -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) | head -50

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ ! -f gradlew ]; then
            echo "Gradle wrapper not found inside extracted project."
            find . -maxdepth 4 -name gradlew -print
            exit 1
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HANIMEX-APK
          path: |
            ${{ github.workspace }}/project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
